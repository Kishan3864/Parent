# ParentalTrack - parent.flexypdf.com
#
# One upstream: the ASP.NET Core process serves BOTH the JSON API (/api/v1/...) and the built
# admin panel (static files + SPA fallback), so nginx only has to proxy. This matches the pattern
# used by the other sites on this box.
#
# Install with deploy/server-setup.sh, then let certbot add the TLS server block:
#   sudo certbot --nginx -d parent.flexypdf.com
# Certbot rewrites this file in place, adding the 443 block and the 80 -> 443 redirect.

server {
    listen 80;
    listen [::]:80;
    server_name parent.flexypdf.com;

    access_log /var/log/nginx/parent.flexypdf.com.access.log;
    error_log  /var/log/nginx/parent.flexypdf.com.error.log;

    # Location batches are small JSON documents; nothing here uploads files.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:5090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # UseForwardedHeaders reads this, so the app knows the request arrived over TLS and does not
        # try to redirect an already-secure request. Without it every request 307s in a loop.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
